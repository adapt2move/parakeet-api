# Pin both image references to tested digests before production deployment.
apiVersion: v1
kind: Namespace
metadata:
  name: parakeet
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parakeet-data
  namespace: parakeet
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: parakeet-api
  namespace: parakeet
spec:
  selector:
    app: parakeet-api
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parakeet-api
  namespace: parakeet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: parakeet-api
  template:
    metadata:
      labels:
        app: parakeet-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: ghcr.io/adapt2move/parakeet-api:main
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: parakeet-keys
              key: API_KEY
        - name: WORKER_API_KEY
          valueFrom:
            secretKeyRef:
              name: parakeet-keys
              key: WORKER_API_KEY
        - name: PUBLIC_BASE_URL
          value: http://parakeet-api.parakeet.svc.cluster.local:8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: api-tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          failureThreshold: 24
      - name: worker
        image: ghcr.io/adapt2move/parakeet-worker:main
        ports:
        - name: health
          containerPort: 8765
        env:
        - name: WORKER_API_KEY
          valueFrom:
            secretKeyRef:
              name: parakeet-keys
              key: WORKER_API_KEY
        - name: API_URL
          value: http://127.0.0.1:8080
        - name: PARAKEET_THREADS
          value: '3'
        - name: TMPDIR
          value: /scratch
        resources:
          requests:
            cpu: 250m
            memory: 3Gi
            ephemeral-storage: 1Gi
          limits:
            cpu: 3500m
            memory: 6Gi
            ephemeral-storage: 3Gi
        volumeMounts:
        - name: scratch
          mountPath: /scratch
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /health
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: health
          periodSeconds: 15
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: health
          periodSeconds: 5
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: parakeet-data
      - name: api-tmp
        emptyDir:
          sizeLimit: 384Mi
      - name: scratch
        emptyDir:
          sizeLimit: 2Gi
