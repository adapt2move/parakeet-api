[project]
name = "parakeet-api"
version = "0.1.0"
description = "CPU Parakeet transcription with OpenAI and AssemblyAI file APIs"
requires-python = ">=3.11,<3.13"
license = "EUPL-1.2"
authors = [{name = "Adapt2Move GmbH"}]
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1"]

[project.optional-dependencies]
worker = [
    "sherpa-onnx==1.13.8",
    "numpy==2.4.6",
    "sherpa-onnx-core==1.13.8",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.16.8,<1",
    "openai>=3.16.2,<4",
    "assemblyai>=1.5.5,<2",
    "pydantic-settings>=2,<3",
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
