[project]
name = "parakeet-api"
version = "0.1.0"
description = "CPU Parakeet transcription with OpenAI and AssemblyAI file APIs"
requires-python = ">=3.12,<3.16"
license = "EUPL-1.2"
authors = [{name = "Adapt2Move GmbH"}]
dependencies = ["starlette==1.10.0", "pydantic==2.14.2", "uvicorn==0.54.0", "httpx==0.28.1"]

[project.optional-dependencies]
worker = [
    "sherpa-onnx==2.0.1",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.0,<1",
    "openai>=3.28.0,<4",
    "assemblyai>=1.6.1,<2",
    "pydantic-settings>=2,<3",
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
