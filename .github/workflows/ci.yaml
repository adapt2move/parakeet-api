name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  # Manual runs on other branches test images but never publish them.
  PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.22'
          python-version: '3.11'
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test integrations/cap/runtime/preload.test.cjs
  containers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api
          load: true
          tags: parakeet-api:test
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: worker
          load: true
          tags: parakeet-worker:test
          cache-from: type=gha,scope=worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=worker-${{ matrix.arch }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.22'
          python-version: '3.11'
      - name: Test real inference with synthetic speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -s 135 -w /tmp/speech.wav 'Hello world. This recording tests accurate word timestamps and the transcription queue.'
          uv sync --frozen
          uv run python scripts/smoke.py /tmp/speech.wav
      - name: Publish tested images
        if: env.PUBLISH == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.sha }}
        run: |
          for component in api worker; do
            image="ghcr.io/adapt2move/parakeet-$component"
            docker tag "parakeet-$component:test" "$image:sha-$SHA-$ARCH"
            docker push "$image:sha-$SHA-$ARCH"
          done
  manifests:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: containers
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture manifests
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          for component in api worker; do
            image="ghcr.io/adapt2move/parakeet-$component"
            docker buildx imagetools create --tag "$image:sha-$SHA" --tag "$image:$REF_NAME" \
              "$image:sha-$SHA-amd64" "$image:sha-$SHA-arm64"
          done
